<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bike spot</title>
<style>
  /* Sky behind the 3D world; its bottom matches the fog so the horizon blends in. */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(to bottom, #8fbfe3 0%, #bcd8ee 45%, #e2ebf1 75%, #e2ebf1 100%);
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  /* Shown for a few seconds after landing: how to look around. */
  #hint {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; white-space: nowrap; background: rgba(54, 68, 76, 0.72); color: #fff;
    font: 600 14px -apple-system, system-ui, sans-serif; letter-spacing: 0.01em;
    opacity: 0; transition: opacity 0.5s ease; pointer-events: none; z-index: 2;
  }
  body.landed #hint { animation: hint 4.5s ease 0.3s both; }
  @keyframes hint { 0%, 100% { opacity: 0; } 12%, 78% { opacity: 1; } }
</style>
</head>
<body>
<div id="hint">Drag to look around · Pinch to zoom</div>
<script src="three.min.js"></script>
<script src="site.js"></script>
<script src="spot.js"></script>
</body>
</html>
